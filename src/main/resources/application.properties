spring.application.name=qa-test-tracker
# Story #6: expose health endpoint for monitoring
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# Persistence: file-based H2 so data survives an app restart (see docs/persistence-note.md)
spring.datasource.url=jdbc:h2:file:./data/qatracker
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update

# H2 console for demo purposes: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
